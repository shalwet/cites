<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #58a6ff;
            font-size: 28px;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.2s;
        }

        nav a:hover {
            background: #30363d;
            border-color: #58a6ff;
            color: #58a6ff;
            transform: translateX(4px);
        }

        nav a .icon {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Projects</h1>
        <nav>
            <a href="copilot.html">
                <span class="icon">✈️</span>
                GitHub Copilot
            </a>
            <a href="cursor.html">
                <span class="icon">🖱️</span>
                Cursor
            </a>
            <a href="gigachat.html">
                <span class="icon">💬</span>
                GigaChat
            </a>
            <a href="qwen.html">
                <span class="icon">🧠</span>
                Qwen
            </a>
            <a href="qwen_web_def.html">
                <span class="icon"></span>
                Qwen Web Def
            </a>
            <a href="zai.html">
                <span class="icon"></span>
                Z.ai
            </a>
        </nav>
    </div>
</body>
</html>
